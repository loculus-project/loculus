name: mirror-images
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/mirror-images.txt
      - .github/workflows/mirror-images.yml
  push:
    branches:
      - main
    paths:
      - .github/mirror-images.txt
      - .github/workflows/mirror-images.yml
permissions:
  packages: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_READ_PUBLIC }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          while read -r src
          do
            dst="ghcr.io/loculus-project/mirror/${src##*/}"
            skopeo inspect --raw "docker://$dst" > /dev/null 2>&1 && continue
            skopeo copy --all --preserve-digests "docker://$src" "docker://$dst"
          done < .github/mirror-images.txt
