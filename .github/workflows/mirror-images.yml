name: mirror-images
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - .github/mirror-images.txt
      - .github/scripts/mirror-images.py
      - .github/workflows/mirror-images.yml
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/mirror-images.py
  mirror:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    concurrency:
      group: mirror-images
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_READ_PUBLIC }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 .github/scripts/mirror-images.py --publish
