name: backend-tests
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ci-${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}-backend-tests
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_EXTRA_TESTS: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_READ_PUBLIC }}
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          # Keep in sync with the other Java versions (backend/build.gradle, backend/Dockerfile)
          java-version: "25"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run tests
        # shorter than the 15-minute job cap so diagnostics still upload on a hang
        timeout-minutes: 13
        working-directory: ./backend
        run: |
          mkdir -p build/diagnostics
          sample() {
            {
              date --iso-8601=seconds
              pg=$(timeout 10 docker ps -a --format '{{.ID}} {{.Image}}' | awk '/postgres/{print $1; exit}')
              echo "postgres=${pg:-none}"
              timeout 10 docker stats --no-stream
              [ -n "$pg" ] || return 0
              timeout 10 docker exec "$pg" psql -U test -d test -c \
                "select pid,state,wait_event_type,wait_event,now()-xact_start as xact_age,now()-query_start as query_age,pg_blocking_pids(pid) as blocked_by,left(query,200) as query from pg_stat_activity order by xact_start" 2>&1
              # relation size moves during an open transaction; tuple counters do not
              timeout 10 docker exec "$pg" psql -U test -d test -c \
                "select relname,pg_relation_size(relid) as heap_bytes,n_dead_tup from pg_stat_user_tables where relname in ('data_use_terms_table','table_update_tracker','sequence_entries','metadata_upload_aux_table','sequence_upload_aux_table') order by relname" 2>&1
              timeout 10 docker exec "$pg" psql -U test -d test -c \
                "select locktype,relation::regclass,mode,granted,pid from pg_locks where not granted" 2>&1
            } >> build/diagnostics/progress.log 2>&1
          }
          threads() {
            jcmd -l > "build/diagnostics/java-$1.txt" 2>&1 || true
            for pid in $(awk '/^[0-9]+ / && $0 !~ /sun\.tools\.jcmd/ {print $1}' "build/diagnostics/java-$1.txt"); do
              jcmd "$pid" Thread.print -l > "build/diagnostics/threaddump-$1-$pid.txt" 2>&1 || true
            done
          }
          ( SECONDS=0; next=60
            while [ "$SECONDS" -lt 780 ]; do
              sleep 10; sample
              if [ "$SECONDS" -ge "$next" ]; then threads "at${SECONDS}s"; next=$((next + 60)); fi
            done ) >/dev/null 2>&1 &
          sampler=$!
          rc=0
          ./gradlew test || rc=$?
          kill "$sampler" 2>/dev/null || true
          exit $rc
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/build/diagnostics
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          # Keep in sync with the other Java versions (backend/build.gradle, backend/Dockerfile)
          java-version: "25"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check Format And Lint
        run: ./gradlew ktlintCheck
        working-directory: ./backend
