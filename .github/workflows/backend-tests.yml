name: backend-tests
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}-backend-tests
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    # Deliberately larger than the `Run tests` step timeout below: a *job* timeout cancels the job,
    # which skips every remaining step, so the diagnostics upload would never run. The step timeout
    # fails just that step and lets `if: always()` steps continue.
    timeout-minutes: 20
    env:
      RUN_EXTRA_TESTS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_READ_PUBLIC }}
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          # Keep in sync with the other Java versions (backend/build.gradle, backend/Dockerfile)
          java-version: "25"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run tests
        timeout-minutes: 15
        run: ./gradlew test
        working-directory: ./backend
      # Gradle already writes these; without an upload they die with the runner. The JUnit XML
      # carries per-class start times and captured stdout, which is what localises a hang.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            backend/build/test-results/test/**/*.xml
            backend/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          # Keep in sync with the other Java versions (backend/build.gradle, backend/Dockerfile)
          java-version: "25"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check Format And Lint
        run: ./gradlew ktlintCheck
        working-directory: ./backend
