name: backend-tests
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_extra_tests:
        description: Run SubmitLargeBatchTest outside main
        required: true
        default: true
        type: boolean
      run_only_submit_large_batch_test:
        description: Run only SubmitLargeBatchTest, for comparable healthy and slow samples
        required: true
        default: true
        type: boolean
concurrency:
  # Each manual dispatch needs its own group so a hang hunt can run concurrently.
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}-backend-tests
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    # larger than individual steps so logs can be collected
    timeout-minutes: 10
    env:
      RUN_EXTRA_TESTS: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.run_extra_tests) }}
      RUN_ONLY_SUBMIT_LARGE_BATCH_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.run_only_submit_large_batch_test }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_READ_PUBLIC }}
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          # Keep in sync with the other Java versions (backend/build.gradle, backend/Dockerfile)
          java-version: "25"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run tests
        # Healthy full-suite runs finish in about five minutes; six minutes makes
        # the pathological batch tail fail sooner while leaving time for artifacts.
        timeout-minutes: 6
        working-directory: ./backend
        run: |
          # Threaddump collected to help debug test hangs
          mkdir -p build/diagnostics
          dump() {
            # jcmd -l includes the forked Gradle test executor as well as the daemon.
            # Keep its PID-to-command mapping, then include ownable synchronizers in
            # each dump so a Java-side lock is visible if this is not a JDBC wait.
            jcmd -l > "build/diagnostics/java-processes-$1.txt" 2>&1 || true
            ps -eo pid,ppid,stat,etime,args > "build/diagnostics/processes-$1.txt" 2>&1 || true
            for pid in $(awk '/^[0-9]+ / && $0 !~ /sun\.tools\.jcmd/ {print $1}' "build/diagnostics/java-processes-$1.txt"); do
              jcmd "$pid" VM.command_line > "build/diagnostics/jvm-command-line-$1-$pid.txt" 2>&1 || true
              jcmd "$pid" Thread.print -l > "build/diagnostics/threaddump-$1-$pid.txt" 2>&1 || true
            done
          }
          probe() {
            {
              df -h; echo; free -m; echo; timeout 10 docker ps -a; echo; timeout 10 docker stats --no-stream
              # The ancestor filter misses if the image is referenced by digest, so match the name too
              containers=$(timeout 10 docker ps -a --format '{{.ID}} {{.Image}}')
              pg=$(echo "$containers" | awk '/postgres/{print $1; exit}')
              minio=$(echo "$containers" | awk '/minio/{print $1; exit}')
              echo "postgres=${pg:-none} minio=${minio:-none}"
              for c in $pg $minio; do
                # OOMKilled separates "container died" from "container alive but silent"
                timeout 10 docker inspect --format '{{.Name}} {{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarting={{.State.Restarting}}' "$c"
                echo "===== docker logs $c"; timeout 10 docker logs --tail 200 "$c" 2>&1
              done
              [ -n "$pg" ] || return 0
              for q in \
                "select pid,state,wait_event_type,wait_event,now()-xact_start as xact_age,now()-query_start as query_age,pg_blocking_pids(pid) as blocked_by,left(query,300) as query from pg_stat_activity order by xact_start" \
                "select datname,xact_commit,xact_rollback,tup_inserted,tup_updated,tup_deleted,blks_read,blks_hit,temp_files,temp_bytes,deadlocks from pg_stat_database where datname=current_database()" \
                "select backend_type,object,context,reads,writes,writebacks,extends,fsyncs from pg_stat_io where backend_type in ('client backend','checkpointer','background writer') order by backend_type,object,context" \
                "select locktype,relation::regclass,mode,granted,pid from pg_locks order by granted,pid"; do
                echo "===== $q"
                timeout 10 docker exec "$pg" psql -U test -d test -c "$q" 2>&1
              done
            } > "build/diagnostics/resources-$1.txt" 2>&1
          }
          progress() {
            {
              date --iso-8601=seconds
              containers=$(timeout 10 docker ps -a --format '{{.ID}} {{.Image}}')
              pg=$(echo "$containers" | awk '/postgres/{print $1; exit}')
              echo "postgres=${pg:-none}"
              timeout 10 docker stats --no-stream
              [ -n "$pg" ] || return 0
              timeout 10 docker exec "$pg" psql -U test -d test -c \
                "select pid,application_name,state,wait_event_type,wait_event,now()-xact_start as xact_age,now()-query_start as query_age,pg_blocking_pids(pid) as blocked_by,left(query,300) as query from pg_stat_activity order by xact_start" 2>&1
              timeout 10 docker exec "$pg" psql -U test -d test -c \
                "select datname,xact_commit,xact_rollback,tup_inserted,tup_updated,tup_deleted,blks_read,blks_hit,temp_files,temp_bytes,deadlocks from pg_stat_database where datname=current_database()" 2>&1
            } >> build/diagnostics/progress.log 2>&1
          }
          sampler() {
            SECONDS=0
            next_full_sample=30
            while [ "$SECONDS" -lt 350 ]; do
              sleep 10
              elapsed=$SECONDS
              progress "at${elapsed}s"
              if [ "$elapsed" -ge "$next_full_sample" ]; then
                dump "at${elapsed}s"
                probe "at${elapsed}s"
                next_full_sample=$((next_full_sample + 30))
              fi
            done
          }
          # The 10-second stream quantifies progress; a complete JVM/locks/logs
          # snapshot every 30 seconds preserves enough state for post-mortem work.
          ( sampler ) >/dev/null 2>&1 &
          watchdog=$!
          rc=0
          if [ "$RUN_ONLY_SUBMIT_LARGE_BATCH_TEST" = "true" ]; then
            ./gradlew test --tests org.loculus.backend.controller.submission.SubmitLargeBatchTest || rc=$?
          else
            ./gradlew test || rc=$?
          fi
          kill "$watchdog" 2>/dev/null || true
          exit $rc
      - name: Collect diagnostics
        if: failure()
        working-directory: ./backend
        run: |
          if ls build/test-results/test/*.xml >/dev/null 2>&1; then
            rm -rf build/test-results/test/binary
          else
            ./gradlew recoverTestReport || true
          fi
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            backend/build/test-results/test/**
            backend/build/reports/recovered/**
            backend/build/diagnostics/**
          if-no-files-found: warn
      - name: Upload hang diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-hang-diagnostics
          path: backend/build/diagnostics/**
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          # Keep in sync with the other Java versions (backend/build.gradle, backend/Dockerfile)
          java-version: "25"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check Format And Lint
        run: ./gradlew ktlintCheck
        working-directory: ./backend
