name: helm-schema-lint

on:
  pull_request:
    paths:
      - "kubernetes/**"
      - "docs/src/content/docs/reference/helm-chart-config.mdx"
      - ".github/workflows/helm-schema-lint.yaml"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.3

      - name: Check schema annotations
        run: python3 kubernetes/utils/check_schema_annotations.py

      - name: Run Helm lint on values files
        run: |
          helm lint kubernetes/loculus -f kubernetes/loculus/values.yaml
          helm lint kubernetes/loculus -f kubernetes/loculus/values.yaml -f kubernetes/loculus/values_e2e_and_dev.yaml
          helm lint kubernetes/loculus -f kubernetes/loculus/values.yaml -f kubernetes/loculus/values_preview_server.yaml
          helm lint kubernetes/loculus -f kubernetes/loculus/values.yaml -f kubernetes/loculus/values_preview_server.yaml -f kubernetes/loculus/values_preview_raw_reads_server.yaml
          helm lint kubernetes/loculus -f kubernetes/loculus/values.yaml -f kubernetes/loculus/values_preview_server.yaml -f kubernetes/loculus/values_preview_persistent_server.yaml

      - name: Test browser authentication config rendering
        run: bash kubernetes/test-browser-auth-config.sh

      - name: Test backend issuer config rendering
        run: bash kubernetes/test-backend-auth-config.sh
