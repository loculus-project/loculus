name: Check format and types - integration tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'integration-tests/**'
      - '.github/workflows/check-format-and-types-integration-tests.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}-check-format-and-types-integration-tests
  cancel-in-progress: true

jobs:
  check-format-and-types:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./integration-tests
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: integration-tests/.nvmrc
          cache: 'npm'
          cache-dependency-path: integration-tests/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check types
        run: npm run check-types

      - name: Check formatting
        run: npm run format:check
