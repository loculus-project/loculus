{{- if not .Values.disableBackend }}
apiVersion: v1
kind: Service
metadata:
  name: loculus-backend-service
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: "{{ include "loculus.serversTransportRef" . }}"
  labels:
    app: loculus
    component: backend
spec:
  {{- template "loculus.serviceType" . }}
  selector:
    app: loculus
    component: backend
  ports:
    - port: 8079
      targetPort: 8079
      {{- if ne $.Values.environment "server" }}
      nodePort: 30082
      {{- end }}
      protocol: TCP
      name: http
{{- if .Values.enableServiceMonitor }}
---
apiVersion: v1
kind: Service
metadata:
  name: loculus-backend-management-service
  labels:
    app: loculus
    component: backend-management
spec:
  type: ClusterIP
  selector:
    app: loculus
    component: backend
  ports:
    - port: 8078
      targetPort: management
      protocol: TCP
      name: management
{{- end }}
{{- end }}
