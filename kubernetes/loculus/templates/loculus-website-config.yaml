{{- $websiteConfig := include "loculus.generateWebsiteConfig" . | fromYaml }}
{{- $organisms := $websiteConfig.organisms }}
{{- $_ := set $websiteConfig "organisms" (dict) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loculus-website-config
data:
  website_config.json: |
    {{ $websiteConfig | toJson }}
  runtime_config.json: |
    {
        "name" : "{{ $.Values.name }}",
        "insecureCookies": {{ $.Values.insecureCookies }},
        "serverSide": {
            {{- if .Values.usePublicRuntimeConfigAsServerSide }}
            {{- /* serverSide.lapisUrls must be ABSOLUTE URLs: relative public proxy paths (/api/lapis/<organism>) are browser-only and would throw when fetched from Node. In this branch (deploy.py --from_live, used with --skip-schema-validation) we therefore inline the fields instead of including loculus.publicRuntimeConfig, which emits proxy URLs under "lapisUrls". */ -}}
            "backendUrl": "{{ include "loculus.backendUrl" . }}",
            "lapisUrls": {{- include "loculus.generateExternalLapisUrls" (dict "lapisUrlTemplate" (include "loculus.lapisUrlTemplate" .) "config" .Values) | fromYaml | toJson }},
            "keycloakUrl": "{{ include "loculus.keycloakUrl" . }}"
            {{- else }}
            {{ if $.Values.disableBackend -}}
            "backendUrl": "http://{{ $.Values.localHost }}:8079",
            {{- else -}}
            "backendUrl": "http://loculus-backend-service:8079",
            {{- end }}
            "lapisUrls": {{- include "loculus.generateInternalLapisUrls" . | fromYaml | toJson }},
            "keycloakUrl": "{{ if not .Values.disableWebsite -}}http://loculus-keycloak-service:8083{{ else -}}http://{{ $.Values.localHost }}:8083{{ end }}"
            {{- end }}
        },
        "public": {
          {{- template "loculus.publicRuntimeConfig" . -}}
        },
        "backendKeycloakClientSecret" : "[[backendKeycloakClientSecret]]",
        {{/* Local config generation sets disableWebsite because it renders config without deploying the website. */}}
        "oidcTransactionCookieSecret" : {{ if or .Values.testconfig .Values.disableWebsite }}"test-oidc-transaction-cookie-secret"{{ else }}"[[oidcTransactionCookieSecret]]"{{ end }}
    }
{{- range $key, $organismConfig := $organisms }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loculus.websiteOrganismConfigMapName" $key }}
data:
  {{ $key }}.json: |
    {{ $organismConfig | toJson }}
{{- end }}
