{{- $dockerTag := include "loculus.dockerTag" .Values }}
{{- if not .Values.disableWebsite }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loculus-website
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: {{$.Values.replicas.website}}
  selector:
    matchLabels:
      app: loculus
      component: website
  template:
    metadata:
      annotations:
        valuesHash: {{ .Values | toJson | sha256sum | quote }}
      labels:
        app: loculus
        component: website
    spec:
      {{- include "possiblePriorityClassName" . | nindent 6 }}
      {{- include "loculus.podScheduling" . | nindent 6 }}
      initContainers:
{{- include "loculus.configProcessor" (dict "name" "loculus-website-config" "dockerTag" $dockerTag "imagePullPolicy" $.Values.imagePullPolicy) | nindent 8 }}
      containers:
        - name: website
          image: "{{ $.Values.images.website.repository }}:{{ $.Values.images.website.tag | default $dockerTag }}"
          imagePullPolicy: "{{ $.Values.images.website.pullPolicy | default $.Values.imagePullPolicy }}"
          {{- include "loculus.resources" (list "website" .Values) | nindent 10 }}
          ports:
            - containerPort: 3000
          {{- $lapisCache := .Values.website.lapisCache }}
          {{- $pageCache := .Values.website.pageCache }}
          {{- $cacheDiskMB := add (ternary $lapisCache.diskMB 0 $lapisCache.enabled) (ternary $pageCache.diskMB 0 $pageCache.enabled) }}
          {{- if or $lapisCache.enabled $pageCache.enabled }}
          env:
            {{- if $lapisCache.enabled }}
            - name: LAPIS_CACHE_MEMORY_MB
              value: {{ $lapisCache.memoryMB | quote }}
            - name: LAPIS_CACHE_DISK_MB
              value: {{ $lapisCache.diskMB | quote }}
            - name: LAPIS_CACHE_FRESH_SECONDS
              value: {{ $lapisCache.freshSeconds | quote }}
            {{- end }}
            {{- if $pageCache.enabled }}
            - name: PAGE_CACHE_MEMORY_MB
              value: {{ $pageCache.memoryMB | quote }}
            - name: PAGE_CACHE_DISK_MB
              value: {{ $pageCache.diskMB | quote }}
            - name: PAGE_CACHE_EDGE_HEADERS
              value: {{ $pageCache.edgeCacheHeaders | quote }}
            {{- end }}
            - name: WEBSITE_CACHE_VERSION_POLL_SECONDS
              value: {{ .Values.website.cacheMaintenance.dataVersionPollSeconds | quote }}
            - name: WEBSITE_CACHE_OLD_VERSION_GRACE_SECONDS
              value: {{ .Values.website.cacheMaintenance.oldVersionGraceSeconds | quote }}
            - name: WEBSITE_CACHE_MAX_AGE_HOURS
              value: {{ .Values.website.cacheMaintenance.maxAgeHours | quote }}
            {{- if gt (int $cacheDiskMB) 0 }}
            - name: WEBSITE_CACHE_DIR
              value: /cache
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: loculus-website-config-processed
              mountPath: /config
            {{- if gt (int $cacheDiskMB) 0 }}
            - name: website-cache
              mountPath: /cache
            {{- end }}
          # /loculus-info renders no LAPIS queries; / sends 3 per organism on every probe
          livenessProbe:
            httpGet:
              path: /loculus-info
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /loculus-info
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      imagePullSecrets:
        - name: custom-website-sealed-secret
      volumes:
        - name: loculus-website-config
          projected:
            sources:
              - configMap:
                  name: loculus-website-config
              {{ range $_, $item := (include "loculus.enabledOrganisms" . | fromJson).organisms }}
              - configMap:
                  name: {{ include "loculus.websiteOrganismConfigMapName" $item.key }}
                  items:
                    - key: {{ printf "%s.json" $item.key | quote }}
                      path: {{ printf "organisms/%s.json" $item.key | quote }}
              {{ end }}
        - name: loculus-website-config-processed
          emptyDir: {}
        {{- $cacheDisk := add (ternary .Values.website.lapisCache.diskMB 0 .Values.website.lapisCache.enabled) (ternary .Values.website.pageCache.diskMB 0 .Values.website.pageCache.enabled) }}
        {{- if gt (int $cacheDisk) 0 }}
        # The caches keep their files within their diskMB budgets; exceeding sizeLimit would evict the pod.
        - name: website-cache
          emptyDir:
            sizeLimit: {{ div (mul (int $cacheDisk) 6) 5 }}Mi
        {{- end }}
{{- end }}
