{{- if not .Values.disableWebsite }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loculus-website
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: {{$.Values.replicas.website}}
  selector:
    matchLabels:
      app: loculus
      component: website
  template:
    metadata:
      annotations:
        valuesHash: {{ .Values | toJson | sha256sum | quote }}
      labels:
        app: loculus
        component: website
    spec:
      {{- include "possiblePriorityClassName" . | nindent 6 }}
      {{- include "loculus.podScheduling" . | nindent 6 }}
      {{- include "loculus.podSecurityContext" (list "website" $.Values) | nindent 6 }}
      initContainers:
      {{- include "loculus.configProcessor" (dict "name" "loculus-website-config" "values" $.Values "Values" $.Values) | nindent 8 }}
      containers:
        - name: website
          image: {{ include "loculus.image" (dict "name" "website" "defaultRepository" "ghcr.io/loculus-project/website" "values" $.Values) }}
          imagePullPolicy: {{ include "loculus.imagePullPolicy" (dict "name" "website" "values" $.Values) }}
          {{- include "loculus.resources" (list "website" .Values) | nindent 10 }}
          {{- include "loculus.containerSecurityContext" (list "website" $.Values) | nindent 10 }}
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: loculus-website-config-processed
              mountPath: /config
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      imagePullSecrets:
        - name: custom-website-sealed-secret
      volumes:
        - name: loculus-website-config
          projected:
            sources:
              - configMap:
                  name: loculus-website-config
              {{ range $_, $item := (include "loculus.enabledOrganisms" . | fromJson).organisms }}
              - configMap:
                  name: {{ include "loculus.websiteOrganismConfigMapName" $item.key }}
                  items:
                    - key: {{ printf "%s.json" $item.key | quote }}
                      path: {{ printf "organisms/%s.json" $item.key | quote }}
              {{ end }}
        - name: loculus-website-config-processed
          emptyDir: {}
{{- end }}
