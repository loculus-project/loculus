secrets:
  service-accounts:
    type: raw
    data:
      insdcIngestUserPassword: "insdc_ingest_user"
      preprocessingPipelinePassword: "preprocessing_pipeline"
      externalMetadataUpdaterPassword: "external_metadata_updater"
      backendUserPassword: "backend"
createTestAccounts: true
# LAPIS requires a Keycloak-issued JWT in this environment (see LAPIS_AUTH_PLAN.md).
# The website attaches its service-account token server-side and browsers are routed
# through the same-origin /api/lapis/<organism> proxy, so all existing specs keep working.
lapis:
  auth:
    enabled: true
backendExtraArgs:
  - "--loculus.debug-mode=true"
keycloakExtraEnv:
  # gzip encoder 404s concurrent first requests for a theme asset: https://github.com/keycloak/keycloak/issues/53238
  - name: KC_SPI_RESOURCE_ENCODING_GZIP_ENABLED
    value: "false"
# Raw reads processing is disabled: the deacon-index image is only published for linux/amd64,
# so it cannot run on arm64 (Apple Silicon) k3d clusters.
disableRawReadsProcessingService: false
disableEnaSubmission: true
auth:
  verifyEmail: false
host: localhost:3000
insecureCookies: true
allowLocalhostAuthRedirects: true
siloImport:
  pollIntervalSeconds: 5
images:
  deaconIndex:
    # Small index built from file-processing's unit test fixture (test/fixtures/deacon.idx),
    # instead of the full production index, so e2e/dev clusters don't need to load a huge
    # index into memory just to bring up the file-processing pod.
    tag: "test"
defaultOrganisms:
  ebola-sudan: &fileSharingOrganismDefaults
    schema:
      submissionDataTypes:
        files:
          enabled: true
          categories:
            - name: rawReads
              displayName: Raw reads
      files:
        - name: annotations
          displayName: Annotations
        - name: rawReads
          displayName: Raw reads
  west-nile: *fileSharingOrganismDefaults
  dummy-organism: *fileSharingOrganismDefaults
  not-aligned-organism: *fileSharingOrganismDefaults
  cchf: *fileSharingOrganismDefaults
  cchf-multi-ref: *fileSharingOrganismDefaults
  enteroviruses: *fileSharingOrganismDefaults
resources:
  raw-reads-processing:
    requests:
      memory: "1Gi"
      cpu: "50m"
    limits:
      memory: "1Gi"
