secrets:
  service-accounts:
    type: raw
    data:
      insdcIngestUserPassword: "insdc_ingest_user"
      preprocessingPipelinePassword: "preprocessing_pipeline"
      externalMetadataUpdaterPassword: "external_metadata_updater"
      backendUserPassword: "backend"
createTestAccounts: true
backendExtraArgs:
  - "--loculus.debug-mode=true"
disableFileProcessingService: true
disableEnaSubmission: true
auth:
  verifyEmail: false
host: localhost:3000
siloImport:
  pollIntervalSeconds: 5
defaultOrganisms:
  ebola-sudan: &fileSharingOrganismDefaults
    schema:
      submissionDataTypes:
        files:
          enabled: true
          categories:
            - name: rawReads
              displayName: Raw reads
      files:
        - name: annotations
          displayName: Annotations
        - name: rawReads
          displayName: Raw reads
  west-nile: *fileSharingOrganismDefaults
  dummy-organism: *fileSharingOrganismDefaults
  not-aligned-organism: *fileSharingOrganismDefaults
  cchf: *fileSharingOrganismDefaults
  cchf-multi-ref: *fileSharingOrganismDefaults
  enteroviruses: *fileSharingOrganismDefaults
