    preprocessing:
    - version: 1
      image: ghcr.io/loculus-project/preprocessing-nextclade
      args:
      - prepro
      replicas: 2  # was 20 for the 3.8M bootstrap; raise again before submitting many SC2 sequences
      configFile:
        log_level: DEBUG
        batch_size: 100
        create_embl_file: false
        segments:
        - name: main
          references:
          - name: singleReference
            nextclade_dataset_name: nextstrain/sars-cov-2/wuhan-hu-1/orfs
            genes:
            - E
            - M
            - "N"
            - ORF1a
            - ORF1b
            - ORF3a
            - ORF6
            - ORF7a
            - ORF7b
            - ORF8
            - ORF9b
            - S
        nextclade_dataset_server: https://data.clades.nextstrain.org/v3
        taxon_id: 2697049
        scientific_name: Severe acute respiratory syndrome coronavirus 2
        molecule_type: genomic RNA
    ingest:
      image: ghcr.io/loculus-project/ingest
      configFile:
        muted_hashes_url: https://pathoplexus.github.io/curation_data/muted_hashes/muted_hashes.tsv
        batch_chunk_size: 1000
        taxon_id: 2697049
        mirror_format: zst
        released_after: '2022-05-15'
    enaDeposition:
      singleReference:
        configFile:
          taxon_id: 2697049
          scientific_name: Severe acute respiratory syndrome coronavirus 2
          molecule_type: genomic RNA
    referenceGenomes:
    - name: main
      references:
      - name: singleReference
        sequence: '[[URL:https://pathoplexus.github.io/reference_store/artefacts/sars-cov-2/reference.fasta]]'
        insdcAccessionFull: MN908947.3
        genes:
        - name: E
          sequence: '[[URL:https://pathoplexus.github.io/reference_store/artefacts/sars-cov-2/E.fasta]]'
