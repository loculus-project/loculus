        generateIndex: true
        autocomplete: true
        header: Host
        ingest: ncbiHostName
        includeInDownloadsByDefault: true
        order: 70
        orderOnDetailsPage: 1560
        definition: The scientific name of the host from which the sample was collected.
        guidance: Use https://www.ncbi.nlm.nih.gov/datasets/taxonomy/browser/ to find scientific names.
        example: Homo sapiens
        noInput: true
