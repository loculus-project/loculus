# PR #7431 query-engine preview: the backend holds every organism's index in its heap.
replicas:
  backend: 1
# Keep the dev database (and Keycloak DB, MinIO) across redeploys: without this every push recreates them empty.
developmentDatabasePersistence: true
# MinIO must persist whenever the dev database does: a fresh DB reissues file IDs that collide with surviving objects,
# and a fresh MinIO loses files the DB references.
developmentS3:
  storageSize: "20Gi"
# The website's LAPIS is the backend's query engine; LAPIS/SILO alongside only cost resources here.
queryEngine:
  enabled: true
  runLapisAlongside: false
  # production-sized: the memory tier comes out of the backend heap (24Gi limit x MaxRAMPercentage=80 = 19.2 GiB)
  responseCache:
    memorySize: "500MB"
    diskSize: "5GB"
    diskSizeLimit: "7Gi"
# 8 concurrent exports saturated the default 30 (30 active + 42 pending); dev Postgres allows 200.
backendDatabasePoolSize: 80
# The claim cursor claims new entries and remembered revisions at once; the full scan (3.6-3.9 s at 3.8M SC2)
# only catches entries reset as stale, rolled-back claims and revisions submitted to another replica.
claimFullScanIntervalSeconds: 60
backendJvmExtraOpts: "-XX:MaxRAMPercentage=80 -Xlog:gc:stdout:time,uptime,level,tags"
developmentDatabase:
  # the 4Gi limit filled with page cache under SC2 ingest (4.24 GB working set; postgres RSS 0.8 GB). The request
  # covers RSS and shared_buffers; the rest is reclaimable page cache.
  resources:
    requests:
      memory: "2Gi"
      cpu: "2000m"
    limits:
      memory: "12Gi"
  settings:
    - max_connections=200
    - shared_buffers=1GB
    # checkpoints ran every 65-100 s under ingest with the 1GB default
    - max_wal_size=4GB
    # above the SC2 claim query (~1 s at 500k entries, known and in pg_stat_statements) so outliers stand out
    - log_min_duration_statement=2s
    # the default cost limit (200) held autovacuum to 15-34 MB/s on NVMe: one TOAST vacuum took 352 s (report 58)
    - autovacuum_vacuum_cost_limit=2000
    # the defaults (vacuum 20 %, analyze 10 % of a table) left sequence_entries unanalyzed for 12 h after a 1M ingest,
    # and the stale statistics picked a 2.4 s plan over a 30 ms one for the approve query
    - autovacuum_vacuum_scale_factor=0.02
    - autovacuum_vacuum_insert_scale_factor=0.02
    - autovacuum_analyze_scale_factor=0.01
    - autovacuum_naptime=15s
    - maintenance_work_mem=1GB
    - log_lock_waits=on
    - log_autovacuum_min_duration=1s
  # PGDATA on a PersistentVolumeClaim (the cluster's default storage class) instead of the container layer
  storageSize: "20Gi"
  shmSize: "1Gi"
  # exports were 1.5-2.7x slower with the backend on another node: they pull JSONB over the 1 Gbit/s node link
  colocateBackend: true
