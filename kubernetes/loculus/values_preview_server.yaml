        category: Nextclade
        maxNumberOfRecommendedEntries: 2500
        url: https://clades.nextstrain.org/?input-fasta={{[unalignedNucleotideSequences+rich|fasta]}}&dataset-name=community/v-gen-lab/dengue/denv4
