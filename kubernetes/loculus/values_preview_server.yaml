            - ARG:prefix
            - string
            - IDENTIFIER
            - dateRangeString
            prefix: YFV
            regex_pattern: ^[^/][^/]*/[^/]+/(?P<identifier>[^/]+)/\d{4}(?:-\d{2}){0,2}$
