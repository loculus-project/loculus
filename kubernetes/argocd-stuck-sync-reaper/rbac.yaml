  name: argocd-stuck-sync-reaper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-stuck-sync-reaper
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "patch"]
