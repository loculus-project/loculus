# Enables Traefik access logs cluster-wide on k3s (Traefik is installed by k3s in kube-system,
# not by the Loculus Helm chart). Apply once per cluster with:
#   kubectl apply -f kubernetes/traefik/access-logs-helmchartconfig.yaml
# or drop it into /var/lib/rancher/k3s/server/manifests/ on the server node.
# k3s merges this into the bundled Traefik Helm release and restarts Traefik.
#
# Which Loculus ingresses actually produce logs is controlled per ingress via
# `traefikAccessLogs` in the Loculus values.yaml (router.observability.accesslogs annotation).
# Read the logs with: kubectl logs -n kube-system deploy/traefik
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    logs:
      access:
        enabled: true
        format: json
        # Only log slow or failed requests instead of everything:
        # filters:
        #   statuscodes: "400-599"
        #   minduration: "1s"
        fields:
          defaultMode: keep
          names:
            # IP addresses are personal data; drop unless you need them
            ClientHost: drop
            ClientAddr: drop
            ClientUsername: drop
          headers:
            # Never log Authorization / Cookie headers
            defaultMode: drop
            names:
              User-Agent: keep
              Referer: keep
              Content-Type: keep
