plugins {
    id 'java-library'
    // Test helpers shared by the other modules' tests: testFixtures(project(':core'))
    id 'java-test-fixtures'
}

dependencies {
    api "org.springframework.boot:spring-boot-starter-webmvc"
    api "org.springframework.boot:spring-boot-starter-security"
    api "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server"
    api "org.springframework.boot:spring-boot-starter-flyway"
    api "com.fasterxml.jackson.module:jackson-module-kotlin"
    api "org.springframework.boot:spring-boot-jackson2" // Jackson 2 compatibility bridge
    api "org.jetbrains.kotlin:kotlin-reflect"
    api "io.github.microutils:kotlin-logging-jvm:3.0.5"
    api "org.postgresql:postgresql"
    api "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1"
    api platform("org.jetbrains.exposed:exposed-bom:1.5.0")
    api "org.jetbrains.exposed:exposed-spring-boot4-starter"
    api "org.jetbrains.exposed:exposed-jdbc"
    api "org.jetbrains.exposed:exposed-kotlin-datetime"
    api "org.jetbrains.kotlinx:kotlinx-datetime:0.8.0-0.6.x-compat"
    api "org.hibernate.validator:hibernate-validator"
    api "org.keycloak:keycloak-admin-client:26.0.12"
    implementation "org.flywaydb:flyway-database-postgresql" // Version managed by Spring Boot to ensure compatibility

    testFixturesApi "org.springframework.boot:spring-boot-starter-webmvc-test"
    testFixturesApi platform("io.jsonwebtoken:jjwt-bom:0.13.0")
    testFixturesApi "io.jsonwebtoken:jjwt-api"
    testFixturesImplementation "io.jsonwebtoken:jjwt-impl"
    testFixturesImplementation "io.jsonwebtoken:jjwt-jackson"
    testFixturesApi "com.ninja-squad:springmockk:5.0.1"
    testFixturesApi "org.testcontainers:testcontainers:2.0.5"
    testFixturesImplementation "org.testcontainers:testcontainers-postgresql:2.0.5"
    testFixturesImplementation "org.testcontainers:testcontainers-minio:2.0.5"
}
