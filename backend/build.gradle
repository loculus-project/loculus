import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent
import org.jetbrains.kotlin.gradle.plugin.KotlinPluginWrapperKt
import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    // If kotlin version bumped, check if gradle version can be bumped as well
    // Check here: https://kotlinlang.org/docs/gradle-configure-project.html#apply-the-plugin
    // To bump gradle version run: `./gradlew wrapper --gradle-version=VERSION && ./gradlew wrapper`
    // Then commit the changes
    id 'org.jetbrains.kotlin.jvm' version '2.4.20' apply false
    id 'org.jetbrains.kotlin.plugin.spring' version '2.4.20' apply false
    id 'org.jlleitschuh.gradle.ktlint' version '14.2.0' apply false
    id 'org.springdoc.openapi-gradle-plugin' version '1.9.0' apply false
}

// Check if the docker engine is running and reachable
task checkDocker {
    doLast {
        def process = "docker info".execute()
        def output = new StringWriter()
        def error = new StringWriter()
        process.consumeProcessOutput(output, error)
        process.waitFor()

        if (process.exitValue() != 0) {
            throw new GradleException("Docker is not running: ${error.toString()}")
        }
        println "Docker is running."
    }
}

// Conventions shared by all modules. The modules' own build.gradle files only declare their dependencies.
subprojects {
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'org.jetbrains.kotlin.plugin.spring'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.jlleitschuh.gradle.ktlint'

    group = 'org.loculus'
    version = '0.0.1'

    // Keep the Java version in sync with the other Java versions (backend/Dockerfile, CI workflows)
    java {
        sourceCompatibility = '25'
        targetCompatibility = '25'
    }

    kotlin {
        jvmToolchain(25)
        // Added to dismiss warnings, see: https://github.com/loculus-project/loculus/issues/4529
        compilerOptions.freeCompilerArgs.add("-opt-in=kotlin.time.ExperimentalTime")
    }

    dependencyLocking {
        lockAllConfigurations()
        lockMode = LockMode.STRICT
    }

    repositories {
        mavenCentral()
    }

    // As the Spring Boot plugin does for app: manage Kotlin libraries with the version of the Kotlin plugin, not the BOM's
    ext['kotlin.version'] = KotlinPluginWrapperKt.getKotlinPluginVersion(project)
    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
        }
    }

    configurations.all {
        // For now we exclude Jackson 3 and maintain Jackson 2
        // https://spring.io/blog/2025/10/07/introducing-jackson-3-support-in-spring#keep-using-jackson-2-support-temporarily
        // TODO: https://github.com/loculus-project/loculus/issues/5753
        exclude group: "org.springframework.boot", module: "spring-boot-jackson"
        // This project uses springmockk for mocking, so Mockito is excluded
        exclude group: "org.mockito"
    }

    dependencies {
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        ktlint("com.pinterest.ktlint:ktlint-cli:1.8.0") {
            attributes {
                attribute(Bundling.BUNDLING_ATTRIBUTE, getObjects().named(Bundling, Bundling.EXTERNAL))
            }
        }
    }

    // ktlint 1.8.0 crashes on kotlin-compiler-embeddable 2.4.20 (ktlint/ktlint#3289); drop this pin once on ktlint >= 2.0 (the ktlint tasks fail as a reminder)
    configurations.matching { it.name.startsWith("ktlint") }.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "org.jetbrains.kotlin") {
                details.useVersion("2.2.21")
            }
        }
    }
    tasks.matching { it.name.startsWith("ktlint") || it.name.startsWith("runKtlint") }.configureEach {
        doFirst {
            def newKtlint = configurations.ktlint.dependencies.find { it.name == "ktlint-cli" && !it.version?.startsWith("1.") }
            if (newKtlint) {
                throw new GradleException("ktlint is now ${newKtlint.version}: remove the ktlint Kotlin compiler pin in build.gradle")
            }
        }
    }

    tasks.named('test') {
        // Docker is required to start the testing database with https://java.testcontainers.org/
        if (!System.getenv('USE_NONDOCKER_INFRA')?.toBoolean()) {
            dependsOn rootProject.tasks.named('checkDocker')
        }

        useJUnitPlatform()

        // https://github.com/mockk/mockk/pull/1550
        doFirst {
            def agentJar = configurations.testRuntimeClasspath.files.find { it.name.startsWith('byte-buddy-agent-') }
            if (agentJar != null) {
                jvmArgs "-javaagent:${agentJar.absolutePath}"
            } else {
                logger.warn("byte-buddy-agent jar not found on testRuntimeClasspath; running tests without -javaagent")
            }
        }

        // https://github.com/raphw/byte-buddy/issues/1922
        jvmArgs '--sun-misc-unsafe-memory-access=allow'

        // Same reason as org.gradle.jvmargs in gradle.properties, but for the forked test JVM:
        // https://github.com/gradle/gradle/issues/19989
        jvmArgs '-Xshare:off'

        jvmArgs '--enable-native-access=ALL-UNNAMED'

        // Run tests with the same object layout as production
        jvmArgs '-XX:+UseCompactObjectHeaders'

        testLogging {
            events TestLogEvent.FAILED, TestLogEvent.STANDARD_ERROR
            exceptionFormat = TestExceptionFormat.FULL
            showExceptions = true
        }
    }

    task downloadDependencies {
        doLast {
            configurations.all { configuration ->
                if (configuration.canBeResolved) {
                    println "Downloading dependencies for: ${configuration.name}"
                    try {
                        configuration.resolve()
                    } catch (Exception e) {
                        println "Failed to download dependencies for: ${configuration.name}"
                        println e.message
                    }
                }
            }
        }
    }
}
