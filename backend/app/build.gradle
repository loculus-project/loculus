plugins {
    id 'org.springframework.boot'
    id 'org.springdoc.openapi-gradle-plugin'
}

dependencies {
    implementation project(':core')
    implementation project(':v1')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly    "io.micrometer:micrometer-registry-prometheus"

    testImplementation testFixtures(project(':core'))
}

bootRun {
    // Paths passed on the command line (e.g. in start_dev.sh) are relative to the backend directory
    workingDir = rootProject.projectDir
}

tasks.named('bootBuildImage') {
    environment["BP_JVM_VERSION"] = "25"
    // https://paketo.io/docs/howto/configuration/
    environment["BPE_SPRING_PROFILES_ACTIVE"] = "docker"
}

tasks.named("jar") {
    enabled = false // prevent to generate plain jar
}
tasks.named("bootJar") {
    enabled = true
    archiveBaseName.set("backend")
    archiveVersion.set("")
}
