server.port=8079
server.max-http-request-header-size=20KB

springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=alpha
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=5000MB
spring.servlet.multipart.max-request-size=5000MB
spring.mvc.async.request-timeout=36000000

server.compression.enabled=true

spring.datasource.driverClassName=org.postgresql.Driver
# Hikari's default is 10. The query engine alone takes up to 6 connections per metadata export, 4 per sequence download,
# ~9 for the projector and 5 per organism while an index loads, so 10 queues submission requests behind downloads.
# Budget: replicas x pool size + other clients <= Postgres max_connections (default 100).
# All bulk responses together hold at most loculus.query-engine.export-max-concurrent-chunks of these connections
# (default: a third of the pool, at least 4).
spring.datasource.hikari.maximum-pool-size=30
# connections kept open when idle (Hikari defaults this to the pool size)
spring.datasource.hikari.minimum-idle=10
spring.flyway.locations=classpath:db/migration,classpath:org/loculus/backend/db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.baseline-on-migrate=true
# Hold Flyway's lock as a session advisory lock rather than inside an open transaction: CREATE INDEX CONCURRENTLY
# waits for every open transaction, including that one, and would never finish.
spring.flyway.postgresql.transactional-lock=false

springdoc.show-actuator=true
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
# not Ready until the query engine's indexes are loaded (QueryIndexHealthIndicator)
management.endpoint.health.group.readiness.include=readinessState,queryIndex

loculus.cleanup.task.reset-stale-in-processing-after-seconds=60
loculus.cleanup.task.run-every-seconds=60
loculus.pipeline-version-upgrade-check.interval-seconds=10
loculus.seqset-citations.run-every-minutes=360
loculus.maintenance.clean-up-aux-table.run-every-hours=1
loculus.stream.batch-size=1000
loculus.debug-mode=false

loculus.s3.enabled=false
loculus.s3.gc-enabled=false
loculus.s3.gc-orphan-retention-period-minutes=10080
loculus.s3.gc-initial-delay-minutes=15
loculus.s3.gc-frequency-minutes=1440
loculus.s3.bucket.endpoint=
loculus.s3.bucket.bucket=
loculus.s3.bucket.region=
loculus.s3.bucket.access-key=
loculus.s3.bucket.secret-key=
