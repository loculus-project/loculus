target-version = "py312"
line-length = 100

[lint]
select = [
    "E",
    "W",
    "F",
    "B",
    "UP",
    "SIM",
    "I",
    "C90",
    "N",
    "S",
    "C4",
    "DTZ",
    "EM",
    "ISC",
    "ICN",
    "PIE",
    "Q",
    "RSE",
    "RET",
    "PL",
    "FURB",
    "LOG",
    "RUF",
]
ignore = [
    "ISC001",
    "RUF105", # noqa-comments: keep `# noqa: X` instead of `# ruff: ignore[x]`
    "RUF201", # rule-codes-in-selectors: keep rule codes in this config
]
preview = true

