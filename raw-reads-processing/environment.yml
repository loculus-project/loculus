name: loculus-raw-reads-processing
channels:
  - conda-forge
  - bioconda
dependencies:
  - biopython=1.88
  - deacon=0.17.0 # CLI, used only by build-index.sh; the service itself uses the Python bindings (see pyproject.toml)
  - fastapi=0.135.1
  - pydantic=2.12.5
  - pytest=9.0.2
  - python=3.14.3
  - requests=2.32.5
  - ruff=0.15.7
  - uv=0.10.9
  - uvicorn=0.41.0
  - pyyaml=6.0.3
  - openjdk=21
  - xopen=2.1.0
