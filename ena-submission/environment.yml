name: loculus-ena-submission
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Core Python dependencies
  - python=3.15.2 # Pinned to 3.12.x series, check for patch updates within 3.12
  - ca-certificates=2026.11.20 # >=2026.10.19 drops distrusted emSign ECC Root CA - G3
  - certifi=2026.11.20
  - pip=25.2
  - uv=0.13.10
  # Extra dependencies
  - beautifulsoup4=4.15.0
  - click=8.5.1
  - ena-webin-cli=11.0.0
  - fastapi=0.165.0
  - pydantic=2.14.4
  - jsonlines=4.0.0
  - pyyaml=6.0.3
  - requests=2.34.2
  - unzip=6.0
  - psycopg2=2.9.13
  - sqlalchemy=2.1.9
  - slack_sdk=3.48.0
  - xmltodict=1.0.4
  - biopython=1.88
  - pytz=2026.6
  - ruff=0.17.6 # if changing update .pre-commit-config.yaml as well
  - tenacity=9.2.1
  - types-pytz=2026.6.0.20261122
  - types-psycopg2=2.9.21.20261030
  - types-requests=2.33.0.20261030
  - types-pyyaml=6.0.12.20261113
  - types-xmltodict=1.0.1.20250920
  - python-dotenv=1.2.4
  - pytest=9.2.0
  - unidecode=1.4.0
  - orjson
  - orjsonl
  - deepdiff
