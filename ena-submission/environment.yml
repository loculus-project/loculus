name: loculus-ena-submission
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Core Python dependencies
  - python=3.15.1 # Pinned to 3.12.x series, check for patch updates within 3.12
  - ca-certificates=2026.10.19 # >=2026.10.19 drops distrusted emSign ECC Root CA - G3
  - certifi=2026.10.19
  - pip=25.2
  - uv=0.13.5
  # Extra dependencies
  - beautifulsoup4=4.15.0
  - click=8.5.0
  - ena-webin-cli=9.0.3
  - fastapi=0.156.4
  - pydantic=2.14.1
  - jsonlines=4.0.0
  - pyyaml=6.0.3
  - requests=2.34.2
  - unzip=6.0
  - psycopg2=2.9.13
  - sqlalchemy=2.1.6
  - slack_sdk=3.45.0
  - xmltodict=1.0.4
  - biopython=1.88
  - pytz=2026.5
  - ruff=0.17.1 # if changing update .pre-commit-config.yaml as well
  - tenacity=9.2.1
  - types-pytz=2026.5.0.20261006
  - types-psycopg2=2.9.21.20260911
  - types-requests=2.33.0.20261006
  - types-pyyaml=6.0.12.20260906
  - types-xmltodict=1.0.1.20250920
  - python-dotenv=1.2.4
  - pytest=9.1.1
  - unidecode=1.4.0
  - orjson
  - orjsonl
  - deepdiff
